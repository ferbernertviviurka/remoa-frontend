name: Lighthouse
on:
  pull_request:
    paths:
      - 'apps/web/src/app/(marketing)/**'
      - 'apps/web/src/features/landing/**'

# Builds the web alone, like Vercel does (@remoa/contracts is a local copy, D-699).
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remoa-frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { path: remoa-frontend }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: remoa-frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: remoa-frontend/.nvmrc }
      - run: pnpm i --frozen-lockfile
      - run: pnpm --filter @remoa/web build
      # lhci starts `pnpm start` from apps/web (see .lighthouserc.json); budgets live there.
      - run: npx -y @lhci/cli@0.14 autorun --config=.lighthouserc.json
        working-directory: remoa-frontend/apps/web
