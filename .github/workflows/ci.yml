name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# D-822: lint, typecheck, unit shards and e2e shards run as parallel jobs.
# The backend is checked out side by side for the e2e (API + Supabase) and to check that packages/contracts
# is still a faithful copy of remoa-backend/packages/contracts (D-699).
# Private backend repo: add secret REMOA_BACKEND_TOKEN (fine-grained, read-only contents).
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remoa-frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { path: remoa-frontend }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: remoa-frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: remoa-frontend/.nvmrc, cache: pnpm, cache-dependency-path: remoa-frontend/pnpm-lock.yaml }
      - run: pnpm i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm strings:check

  typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remoa-frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { path: remoa-frontend }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/remoa-backend
          path: remoa-backend
          token: ${{ secrets.REMOA_BACKEND_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with: { package_json_file: remoa-frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: remoa-frontend/.nvmrc, cache: pnpm, cache-dependency-path: remoa-frontend/pnpm-lock.yaml }
      - run: pnpm i --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remoa-frontend } }
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { path: remoa-frontend }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: remoa-frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: remoa-frontend/.nvmrc, cache: pnpm, cache-dependency-path: remoa-frontend/pnpm-lock.yaml }
      - run: pnpm i --frozen-lockfile
      # Vitest shards each package's files. Every `test` script has --passWithNoTests (a small package may get no file in a shard).
      - run: pnpm turbo run test -- --shard=${{ matrix.shard }}/3

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remoa-frontend } }
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: { path: remoa-frontend }
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/remoa-backend
          path: remoa-backend
          token: ${{ secrets.REMOA_BACKEND_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with: { package_json_file: remoa-frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version-file: remoa-frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            remoa-frontend/pnpm-lock.yaml
            remoa-backend/pnpm-lock.yaml
      - run: pnpm -C ../remoa-backend i --frozen-lockfile && pnpm i --frozen-lockfile
      - uses: supabase/setup-cli@v1
      # Studio, image proxy, edge functions and log collection are not used by the app.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector && pnpm --silent db:env > .env && pnpm db:migrate
        working-directory: remoa-backend
      - run: pnpm env:local
      # webkit: the iphone-12 project uses devices['iPhone 12'], which runs on WebKit.
      - run: pnpm --filter @remoa/web exec playwright install --with-deps chromium webkit
      # Playwright splits the specs across the 4 jobs; each job has its own Supabase, API and next dev.
      - run: pnpm --filter @remoa/web exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            remoa-frontend/apps/web/playwright-report
            remoa-frontend/apps/web/test-results
          retention-days: 7

  # F27 FR-37: build the web alone (no API: the sitemap falls back to the static pages and the post sample is skipped),
  # start it and check sitemap.xml, robots.txt and the SEO tags of /, /blog and /termos-de-uso. Posts are covered by the e2e.
  seo:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: remoa-frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { path: remoa-frontend }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: remoa-frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version-file: remoa-frontend/.nvmrc, cache: pnpm, cache-dependency-path: remoa-frontend/pnpm-lock.yaml }
      - run: pnpm i --frozen-lockfile
      # G21 FR-55 (P-483): the same build feeds the bundle budget (apps/web/perf-budgets.json: ceiling per route = size on 2026-10-06 + 5%;
      # the F26 goal of 170 KB is informational until reached). `shell: bash` = pipefail, so a failed build is not hidden by tee.
      - run: pnpm --filter @remoa/web build 2>&1 | tee build.log
        shell: bash
      - run: node apps/web/scripts/check-bundle.mjs build.log
      - run: |
          pnpm --filter @remoa/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/robots.txt > /dev/null && break; sleep 1; done
          pnpm seo:check || (cat /tmp/web.log; exit 1)
        env: { SEO_CHECK_URL: 'http://localhost:3000' }
